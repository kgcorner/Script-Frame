<div class="page">

  <main class="content-area">
    <h1>Review Story &amp; Characters</h1>

    <p class="stage">{{ statusLabel }}</p>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <div class="actions">
      <button (click)="approve()">Approve — start final generation</button>
      <input type="text" placeholder="Request a change, e.g. 'make the villain younger'" (keydown.enter)="requestChange($any($event.target).value); $event.preventDefault()" />
    </div>

    <h2>Story</h2>
    <p><strong>Title:</strong> {{ storyData.title }}</p>
    <p><strong>Logline:</strong> {{ storyData.logline }}</p>
    <div class="story">{{ storyData.story }}</div>

    <h2>Characters</h2>
    <div class="character-list">
      <div *ngFor="let c of getPayload().characters; let i = index" class="character-item">
        <button (click)="toggleCharacter(i)">{{ c.name }}{{ c.role ? ' (' + c.role + ')' : '' }}</button>
        <div *ngIf="editingCharacter() === i" class="edit">
          <label>Description</label>
          <textarea [(ngModel)]="characters()[i].description"></textarea>
          <button (click)="saveCharacter(i)">Save &amp; regenerate</button>
        </div>
      </div>
    </div>
  </main>
</div>
